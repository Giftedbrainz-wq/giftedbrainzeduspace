<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082d63"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.ico"><link rel="apple-touch-icon" href="/assets/icon-192.png"><title>Notifications • Gifted Brainz EduSpace</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="network-banner" id="networkBanner"></div><div id="shell"><div class="main"><div class="topbar"><div class="page-title"><span class="ic">🔔</span> Notifications</div><div class="topbar-right"><span class="who" id="who"></span><button class="btn light" onclick="GB.logout()">Log out</button></div></div><div class="content"><section class="hero-banner"><div class="eyebrow">Stay informed</div><h1>Your Notifications</h1><p>Important updates about your account, CBTs, results and Gifted Brainz EduSpace.</p></section><div class="card"><div class="section-head"><h2>Recent notifications</h2><button class="btn light" id="markAll" type="button">Mark all as read</button></div><div id="list"><p class="muted">Loading notifications…</p></div></div></div></div></div>
<script src="/app.js?v=12.1.9"></script><script src="/api.js?v=12.1.9"></script><script src="/gb-ui.js?v=12.1.9"></script><script>
(async()=>{ if(!await GB.requireAuth()) return; GBUI.mount({active:"/notifications.html"}); const list=document.getElementById("list");
function esc(v){return GBUI.esc(v)}
async function load(){try{const x=await GB.api("/api/notifications");const items=x.items||[];list.innerHTML=items.length?items.map(n=>`<article class="card" style="margin:0 0 10px;border:1px solid rgba(8,45,99,.1);background:${n.read?'#fff':'#f4f8ff'}"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><b>${esc(n.title||"Notification")}</b><p style="margin:6px 0 0;line-height:1.55">${esc(n.message||"")}</p><small class="muted">${n.createdAt?new Date(n.createdAt).toLocaleString("en-GB"):""}</small></div>${n.read?'':'<span class="pill">New</span>'}</div>${n.url?"<a class=\"btn light\" style=\"margin-top:10px\" href=\""+esc(n.url)+"\">Open →</a>":""}</article>`).join(""):'<div class="empty"><h3>No notifications yet</h3><p class="muted">You are all caught up.</p></div>';}catch(e){list.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
await load(); document.getElementById("markAll").onclick=async()=>{const b=document.getElementById("markAll");b.disabled=true;try{await GB.api("/api/notifications/read",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({})});await load()}catch(e){alert(e.message)}finally{b.disabled=false}};
})();</script></body></html>
