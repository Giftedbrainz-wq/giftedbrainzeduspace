<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082d63"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.ico">
<title>1-v-1 Challenge • Gifted Brainz EduSpace</title><link rel="stylesheet" href="/styles.css">
<style>
.duel-turn{margin-top:14px;padding:18px;border-radius:16px;background:linear-gradient(135deg,#082d63,#124b9b);color:#fff;text-align:center}
.duel-turn.waiting{background:#f3f6fb;color:#1c2b3a}
.duel-turn h3{margin:0 0 6px}.duel-turn .timer{font-size:2.1rem;font-weight:900;margin-top:8px}.duel-turn .timer.warning{color:#ffd166}
.duel-progress{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:12px}.duel-progress>span{display:block;height:100%;background:#ffd166;width:100%;transform-origin:left center}
.duel-answer.selected{outline:3px solid #ffd166}.duel-answer.correct{border-color:#2e8b57}.duel-answer.wrong{border-color:#c0392b}
.duel-review{margin-top:18px}.review-row{padding:14px;border:1px solid #dbe3ee;border-radius:12px;margin:10px 0;background:#fff}.review-row .review-q{font-weight:800;margin-bottom:8px}.review-player{font-size:.93rem;margin-top:6px}.ok{color:#16794c;font-weight:800}.bad{color:#b42318;font-weight:800}
</style>
</head>
<body><div class="network-banner" id="networkBanner"></div><div id="shell"><div class="main"><div class="topbar"><div class="page-title"><span class="ic">⚔️</span> 1-v-1 Challenge</div><div class="topbar-right"><span class="who" id="who"></span><button class="btn light" onclick="GB.logout()">Log out</button></div></div>
<div class="content"><div class="hero-banner"><div class="eyebrow">Head-to-head practice</div><h1>1-v-1 Challenge ⚔️</h1><p>Take turns answering the same questions. Each turn lasts 30 seconds, and the server keeps the official score.</p></div>
<div id="home" class="panelgrid"><div class="card"><div class="section-head"><h2>Create a challenge</h2></div><label>Subject<select id="subject"></select></label><label>Questions<select id="count"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="15">15 questions</option><option value="20">20 questions</option></select></label><button class="btn gold" id="create">Create 1-v-1 room</button><div id="createMsg"></div></div>
<div class="card"><div class="section-head"><h2>Join a challenge</h2></div><p class="muted">Enter the six-digit room code shared by your opponent.</p><input id="code" inputmode="numeric" maxlength="6" placeholder="e.g. 482913"><button class="btn light" id="join" style="margin-top:10px">Join room</button><div id="joinMsg"></div></div></div>
<div id="room" hidden></div><div id="history" class="card" style="margin-top:18px"><div class="section-head"><h2>Recent 1-v-1 matches</h2></div><div id="historyOut"><p class="muted">Loading…</p></div></div>
</div></div></div>
<script src="/app.js?v=12.1.9"></script><script src="/api.js?v=12.1.9"></script><script src="/gb-ui.js?v=12.1.9"></script>
<script>
GB.requireAuth();
GBUI.mount({active:"/duel.html"});
const $=id=>document.getElementById(id);
let duel=null, refreshTimer=null, clockTimer=null, refreshing=false, submitting=false;
$('subject').innerHTML=GBUI.mySubjects().map(s=>`<option>${GBUI.esc(s)}</option>`).join('');
const msg=(id,text,ok=false)=>{$(id).innerHTML=text?`<p class="${ok?'success':'error'}">${GBUI.esc(text)}</p>`:''};
const playerName=id=>{const p=duel?.players?.find(x=>x.id===id);return p?GBUI.esc(p.name):'Your opponent'};
const scoreText=p=>`${Number(p.score||0)}/${duel.count}`;

async function create(){
  msg('createMsg','');$('create').disabled=true;
  try{duel=await GB.api('/api/duel/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:$('subject').value,count:Number($('count').value)})});renderRoom()}
  catch(e){msg('createMsg',e.message)}finally{$('create').disabled=false}
}
async function join(){
  msg('joinMsg','');$('join').disabled=true;
  try{duel=await GB.api('/api/duel/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value.trim()})});renderRoom()}
  catch(e){msg('joinMsg',e.message)}finally{$('join').disabled=false}
}
function renderRoom(){
  $('home').hidden=true;$('history').hidden=true;$('room').hidden=false;
  clearInterval(refreshTimer);clearInterval(clockTimer);
  draw();
  refreshTimer=setInterval(refresh,1000);
  clockTimer=setInterval(drawClock,250);
}
function drawClock(){
  const el=document.getElementById('turnTimer');
  if(!el||!duel||duel.status!=='active')return;
  const remaining=Math.max(0,Date.parse(duel.turnDeadlineAt||'')-Date.now());
  const seconds=Math.ceil(remaining/1000);
  el.textContent=seconds+'s';
  el.classList.toggle('warning',seconds<=10);
  const bar=document.getElementById('turnProgress');
  if(bar)bar.style.transform=`scaleX(${Math.max(0,Math.min(1,remaining/30000))})`;
  if(seconds<=0&&!refreshing)refresh();
}
function draw(){
  if(!duel)return;
  const me=duel.players.find(p=>p.id===duel.myId)||duel.players[0];
  const qIndex=Number.isInteger(duel.currentQuestionIndex)?duel.currentQuestionIndex:0;
  const q=duel.questions[qIndex];
  const myAnswer=duel.myAnswers?.[qIndex];
  let html=`<div class="card"><div class="section-head"><h2>Room ${GBUI.esc(duel.code)}</h2><span class="pill">${GBUI.esc(duel.status)}</span></div>
  <p><b>${GBUI.esc(duel.subject)}</b> · ${duel.count} questions · <b>30 seconds per turn</b></p>
  <div class="statgrid">${duel.players.map(p=>`<div class="statcard plain"><div class="ic">👤</div><strong>${scoreText(p)}</strong><small>${GBUI.esc(p.name)}${p.id===me?.id?' (you)':''}</small><small>${p.answered}/${duel.count} answered${p.timeouts?' · '+p.timeouts+' timeout'+(p.timeouts===1?'':'s'):''}</small></div>`).join('')}</div>`;
  if(duel.status==='waiting'){
    const waitingLeft=duel.expiresAt?Math.max(0,Date.parse(duel.expiresAt)-Date.now()):0;
    html+=`<div class="card" style="margin-top:14px;text-align:center"><h3>Waiting for your opponent</h3><p class="muted">Share this room code:</p><div style="font-size:2.2rem;font-weight:900;letter-spacing:.15em">${GBUI.esc(duel.code)}</div><p class="muted">This room code expires in <b>${Math.ceil(waitingLeft/60000)} minute(s)</b>. The match starts automatically when another student joins.</p></div>`;
  }else if(duel.status==='active'&&q){
    const myTurn=duel.isMyTurn;
    html+=`<div class="duel-turn ${myTurn?'':'waiting'}"><h3>${myTurn?'🎯 Your turn':'⏳ '+playerName(duel.currentTurnUserId)+' is answering'}</h3><p>${myTurn?'Choose the best answer before the timer reaches zero.':'Your answer is locked until your opponent finishes this turn.'}</p><div class="timer" id="turnTimer">30s</div><div class="duel-progress"><span id="turnProgress"></span></div></div>`;
    html+=`<div class="card" style="margin-top:14px"><div class="section-head"><h3>Question ${qIndex+1} of ${duel.count}</h3><span class="pill">${myTurn?'Your turn':'Waiting'}</span></div><p style="font-size:1.08rem;font-weight:800">${GBUI.esc(q.q)}</p><div>${q.options.map((o,i)=>`<button class="btn light duel-answer" data-answer="${i}" ${myTurn?'':'disabled'} style="display:block;width:100%;text-align:left;margin:8px 0">${String.fromCharCode(65+i)}. ${GBUI.esc(o)}</button>`).join('')}</div></div>`;
  }else if(duel.status==='finished'){
    const scores=duel.players.map(p=>Number(p.score||0));const best=Math.max(...scores);const winners=duel.players.filter(p=>Number(p.score||0)===best);
    html+=`<div class="result-card" style="margin-top:14px;text-align:center"><h2>${winners.length>1?'Draw 🤝':'Winner 🏆'}</h2><p>${winners.length>1?'Both players finished with the same score.':GBUI.esc(winners[0].name)+' wins the challenge.'}</p><div class="statgrid">${duel.players.map(p=>`<div class="statcard plain"><strong>${scoreText(p)}</strong><small>${GBUI.esc(p.name)}</small><small>${Math.round(Number(p.score||0)/duel.count*100)}% accuracy</small></div>`).join('')}</div></div>`;
    html+=renderReview();
  }else if(duel.status==='cancelled'||duel.status==='expired'){
    html+=`<div class="card" style="margin-top:14px;text-align:center"><h3>Room ${GBUI.esc(duel.status)}</h3><p class="muted">${duel.status==='expired'?'The 15-minute room-code window has ended.':'This match room is no longer active.'}</p></div>`;
  }
  html+=`<div style="display:flex;justify-content:center;margin-top:14px"><button class="btn light" id="leaveRoom">${duel.status==='finished'?'Leave match':'Leave current room'}</button></div></div>`;
  $('room').innerHTML=html;
  $('leaveRoom').onclick=leaveRoom;
  document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.answer))));
  drawClock();
}
function renderReview(){
  if(!Array.isArray(duel.review)||!duel.review.length)return '';
  return `<div class="duel-review card"><div class="section-head"><h3>Question-by-question review</h3></div>${duel.review.map((r,i)=>`<div class="review-row"><div class="review-q">${i+1}. ${GBUI.esc(r.question)}</div><div class="review-player"><b>Correct answer:</b> ${String.fromCharCode(65+r.correctAnswer)}. ${GBUI.esc(r.options[r.correctAnswer]??'')}</div>${r.players.map(p=>{const val=p.answer;const text=val==null?'No answer':`${String.fromCharCode(65+val)}. ${GBUI.esc(r.options[val]??'')}`;return `<div class="review-player">${playerName(p.id)}: <span class="${p.correct?'ok':'bad'}">${p.correct?'✓ Correct':'✗ '+(p.timedOut?'Timed out':'Wrong')}</span> — ${text}</div>`}).join('')}</div>`).join('')}</div>`;
}
async function answer(v){
  if(submitting||!duel||duel.status!=='active'||!duel.isMyTurn)return;
  submitting=true;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);
  const index=duel.currentQuestionIndex;
  const previous=duel;
  try{
    duel.myAnswers=duel.myAnswers||{};
    duel.myAnswers[index]=v;
    draw();
    duel=await GB.api('/api/duel/'+encodeURIComponent(duel.id)+'/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index,answer:v}),timeoutMs:10000,retryAttempts:1});
    draw();
  }
  catch(e){alert(e.message);await refresh()}
  finally{submitting=false}
}
async function leaveRoom(){
  if(!duel)return;if(!confirm('Leave this 1-v-1 room? You will need to create or join another room afterwards.'))return;
  try{await GB.api('/api/duel/'+encodeURIComponent(duel.id)+'/leave',{method:'POST'});clearInterval(refreshTimer);clearInterval(clockTimer);duel=null;$('room').hidden=true;$('home').hidden=false;$('history').hidden=false;await loadHistory()}
  catch(e){alert(e.message)}
}
async function refresh(){
  if(!duel||refreshing)return;refreshing=true;
  try{const d=await GB.api('/api/duel/'+encodeURIComponent(duel.id));duel=d;draw();if(['finished','cancelled','expired'].includes(duel.status)){clearInterval(refreshTimer);clearInterval(clockTimer);await loadHistory()}}
  catch(e){if(e&&(/expired|not found|already left/i).test(e.message||'')){clearInterval(refreshTimer);clearInterval(clockTimer);alert(e.message);location.reload()}}
  finally{refreshing=false}
}
async function loadHistory(){
  try{const rows=await GB.api('/api/duels/mine');const current=rows.find(r=>r.canLeave&&['waiting','active'].includes(r.status));if(current&&!duel){duel=current;renderRoom();return}
  $('historyOut').innerHTML=rows.length?rows.map(r=>{const me=r.players.find(p=>p.id===r.myId);const opp=r.players.find(p=>p.id!==r.myId);const outcome=r.status==='finished'?(me?.score>opp?.score?'Win':me?.score<opp?.score?'Loss':'Draw'):r.status;return `<div class="lbrow"><span>⚔️</span><span class="nm">${GBUI.esc(r.subject)} · ${GBUI.esc(r.code)}</span><span>${outcome}</span><span>${r.myScore==null?'—':r.myScore+'/'+r.count}</span></div>`}).join(''):'<p class="muted">No 1-v-1 matches yet.</p>'}
  catch(e){$('historyOut').innerHTML=`<p class="error">${GBUI.esc(e.message)}</p>`}
}
$('create').onclick=create;$('join').onclick=join;GB.requireAuth().then(ok=>{if(ok)loadHistory();});
</script></body></html>
